name: Python CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Build
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build static site
        run: python app.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist/
          if-no-files-found: error

  # 2. Test
  lint-test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: site-build
          path: dist/

      - name: Verify build artifact
        run: python -c "from pathlib import Path; assert Path('dist/index.html').is_file()"

      - name: Run Lint
        run: python -m ruff check .

      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -v

  # 3. Deploy
  deploy:
    name: Deploy GitHub Pages
    needs: [build, lint-test]

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: site-build
          path: dist/

      - name: Sign build with secret
        env:
          DEPLOY_SIGNING_KEY: ${{ secrets.DEPLOY_SIGNING_KEY }}
        run: |
          python - <<'PY'
          import hashlib
          import hmac
          import os
          from pathlib import Path

          key = os.environ.get("DEPLOY_SIGNING_KEY")
          if not key:
              raise SystemExit("Missing DEPLOY_SIGNING_KEY")

          site = Path("dist/index.html")
          signature = hmac.new(
              key.encode(),
              site.read_bytes(),
              hashlib.sha256
          ).hexdigest()

          Path("dist/build-signature.txt").write_text(
              signature + "\n",
              encoding="utf-8"
          )
          print("Build signature created")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
